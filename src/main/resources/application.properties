# =========================================================
# Employee Leave Management System - Main Configuration
# =========================================================
spring.application.name=employee-leave-management

# Active profile:
#   dev   -> Uses H2 in-memory DB (default, runs instantly with zero setup)
#   mysql -> Uses MySQL server (configure connection in application-mysql.properties)
spring.profiles.active=dev

# Server Port
server.port=8080

# Disable auto-running SQL init scripts (DataSeeder.java handles seeding)
spring.sql.init.mode=never

# SpringDoc OpenAPI / Swagger UI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.enabled=true
