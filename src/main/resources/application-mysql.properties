# =========================================================
# Production Profile: MySQL Database
# =========================================================
# To run with MySQL, either set `spring.profiles.active=mysql` in application.properties
# or launch with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#
# Ensure MySQL is running on port 3306 with database created:
# CREATE DATABASE IF NOT EXISTS employee_leave_db;

spring.datasource.url=jdbc:mysql://localhost:3306/employee_leave_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
